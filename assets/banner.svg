<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulsePulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
    }
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(380px); opacity: 0; }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -20px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-25px, 25px); }
    }
    @keyframes nodeBlink {
      0%, 100% { r: 5px; opacity: 0.7; }
      50% { r: 8px; opacity: 1; }
    }
    .pulse-node { animation: nodeBlink 3s infinite ease-in-out; }
    .stream-line { stroke-dasharray: 12, 12; animation: dashStream 20s linear infinite; }
    .orb1 { animation: floatOrb1 8s ease-in-out infinite; }
    .orb2 { animation: floatOrb2 10s ease-in-out infinite; }
    .main-title { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; font-weight: 900; font-size: 50px; letter-spacing: -0.5px; fill: url(#textGrad); }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; font-weight: 500; font-size: 19px; fill: #94a3b8; letter-spacing: 0.5px; }
    .tag { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle class="orb1" cx="200" cy="100" r="140" fill="#6366f1" opacity="0.18" filter="url(#glow)" />
  <circle class="orb2" cx="1020" cy="240" r="160" fill="#ec4899" opacity="0.15" filter="url(#glow)" />
  <circle cx="650" cy="70" r="100" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  <!-- Animated Data Streams & Pipeline Waves -->
  <path class="stream-line" d="M -50 280 Q 250 180, 500 270 T 1050 210 T 1250 280" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" />
  <path class="stream-line" d="M -50 310 Q 300 230, 650 300 T 1250 250" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" />
  <path class="stream-line" d="M -50 230 Q 350 330, 750 220 T 1250 290" fill="none" stroke="#c084fc" stroke-opacity="0.3" stroke-width="2" />

  <!-- Pipeline Network Telemetry Nodes -->
  <g>
    <!-- Node 1 -->
    <circle cx="160" cy="245" r="6" fill="#38bdf8" filter="url(#pulseGlow)" class="pulse-node" />
    <circle cx="160" cy="245" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />

    <!-- Node 2 -->
    <circle cx="480" cy="265" r="7" fill="#818cf8" filter="url(#pulseGlow)" class="pulse-node" style="animation-delay: 0.8s;" />
    <circle cx="480" cy="265" r="16" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.4" />

    <!-- Node 3 -->
    <circle cx="780" cy="235" r="8" fill="#ec4899" filter="url(#pulseGlow)" class="pulse-node" style="animation-delay: 1.6s;" />
    <circle cx="780" cy="235" r="18" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.4" />

    <!-- Node 4 -->
    <circle cx="1040" cy="215" r="6" fill="#38bdf8" filter="url(#pulseGlow)" class="pulse-node" style="animation-delay: 2.3s;" />
    <circle cx="1040" cy="215" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Central Header Content -->
  <g transform="translate(70, 48)">
    <!-- Pill Top Badge -->
    <rect x="0" y="0" width="280" height="34" rx="17" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="18" cy="17" r="5" fill="#10b981" filter="url(#glow)" />
    <text x="32" y="22" class="tag" font-size="13">ENTERPRISE DATA RELIABILITY</text>

    <!-- Main Title -->
    <text x="0" y="90" class="main-title">
      Awesome Data Observability 🔍
    </text>

    <!-- Subtitle -->
    <text x="0" y="130" class="subtitle">
      Curated guide to SaaS platforms, open-source testing frameworks, lineage &amp; pipeline monitoring
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(0, 165)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="14" y="21" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#cbd5e1">📊 Data Quality &amp; SLAs</text>

      <!-- Pill 2 -->
      <rect x="192" y="0" width="180" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="206" y="21" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#cbd5e1">⚡ Anomaly Detection</text>

      <!-- Pill 3 -->
      <rect x="384" y="0" width="200" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="398" y="21" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#cbd5e1">🧬 Lineage &amp; Schema Drift</text>

      <!-- Pill 4 -->
      <rect x="596" y="0" width="180" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="610" y="21" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#cbd5e1">🛠️ dbt-Native Quality</text>

      <!-- Pill 5 -->
      <rect x="788" y="0" width="180" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="802" y="21" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#cbd5e1">💰 Cost &amp; Reliability</text>
    </g>
  </g>

  <!-- Sleek Border -->
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8" />
</svg>
